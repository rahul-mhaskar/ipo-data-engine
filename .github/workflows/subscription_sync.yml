name: Sync IPO Subscriptions

on:
  schedule:
    # 08:00 UTC = 1:30 PM IST (Mon-Fri)
    - cron: '0 8 * * 1-5'
    # 11:45 UTC = 5:15 PM IST (Mon-Fri)
    - cron: '45 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Subscription Sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/fetch_subscription.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ipos.json
          git diff --staged --quiet || (git commit -m "chore: auto-update live subscriptions in ipos.json" && git push)
          
