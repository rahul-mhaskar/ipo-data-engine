name: Sync IPO Subscriptions and GMP

on:
  schedule:
    # 08:00 UTC = 1:30 PM IST (Mon-Fri)
    - cron: '0 8 * * 1-5'
    # 11:45 UTC = 5:15 PM IST (Mon-Fri)
    - cron: '45 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-ipo-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Subscription Sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/fetch_subscription.py

      - name: Run GMP & Momentum Trend Sync
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/fetch_gmp.py

      - name: Run Financial Scorecard Sync
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/fetch_financials.py

      - name: Run Issuer Details & Structure Sync
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/fetch_issuer_details.py
          
      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ipos.json gmp_data.json
          if git diff --staged --quiet; then
            echo "No changes detected across dataset and GMP files."
          else
            git commit -m "chore: auto-sync subscriptions, GMP & financials [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
          
