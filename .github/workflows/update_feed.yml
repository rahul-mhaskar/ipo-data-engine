name: Auto-Update IPO Feed

on:
  schedule:
    # Runs Mon-Fri every 3 hours during Indian market hours
    - cron: '0 4,7,10 * * 1-5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Execute Python Scraper
        run: python scraper.py

      # Automatically commits only if ipos.json changed; succeeds cleanly if no changes
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update IPO status and feeds [skip ci]"
          file_pattern: 'ipos.json'
          
