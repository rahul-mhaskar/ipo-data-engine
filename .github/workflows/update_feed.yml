name: Auto-Update IPO Feed

on:
  schedule:
    # Runs Monday to Friday every 3 hours during Indian market activity (approx 9:30 AM to 5:30 PM IST)
    - cron: '0 4,7,10 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it anytime with a button click

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to auto-commit updated JSON files

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Python Scraper
        run: python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ipos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPO status and feeds [skip ci]" && git push)
          
