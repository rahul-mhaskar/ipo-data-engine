name: Auto-Update IPO Feed

on:
  schedule:
    # 04:35 UTC -> 10:05 AM IST (Listing Debut & Price Discovery Sync)
    - cron: '35 4 * * 1-5'

    # 11:35 UTC -> 5:05 PM IST (Market Closing & Bidding Cutoff Sync)
    - cron: '35 11 * * 1-5'

    # 18:00 UTC -> 11:30 PM IST (Late-night Registrar Allotment Upload)
    - cron: '0 18 * * 1-5'

    # 01:00 UTC -> 06:30 AM IST (Dawn sync for overnight/midnight uploads)
    - cron: '0 1 * * 2-6'

  workflow_dispatch:

# Cancels redundant queued/running jobs on concurrent trigger to prevent runner pile-ups
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Python Scraper
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u scraper.py

      - name: Validate Generated Dataset
        run: |
          if [ ! -s ipos.json ]; then
            echo "Error: ipos.json is missing or empty. Halting commit to protect cache."
            exit 1
          fi

      - name: Publish Health Audit to Summary
        run: |
          if [ -f data_health_audit.md ]; then
            cat data_health_audit.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipos.json data_health_audit.md
          if git diff --staged --quiet; then
            echo "No changes detected in ipos.json."
          else
            git commit -m "Auto-update IPO feed [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
