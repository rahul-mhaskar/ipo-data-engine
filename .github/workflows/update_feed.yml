name: Auto-Update IPO Feed

on:
  schedule:
    # 03:45 UTC -> 09:15 AM IST (Bidding Opens Today Alerts)
    - cron: '45 3 * * 1-5'

    # 04:30 UTC -> 10:00 AM IST (Last Day to Bid Urgency Alerts)
    - cron: '30 4 * * 1-5'

    # 11:35 UTC -> 05:05 PM IST (Market Closing & Bidding Cutoff Sync)
    - cron: '35 11 * * 1-5'

    # 18:00 UTC -> 11:30 PM IST (Late-night Registrar Allotment / GMP Sync)
    - cron: '0 18 * * 1-5'

    # 01:00 UTC -> 06:30 AM IST (Dawn sync for overnight data updates)
    - cron: '0 1 * * 2-6'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin

      - name: Execute Python Scraper
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONUNBUFFERED: "1"
        run: python -u scraper.py

      - name: Validate Generated Dataset
        run: |
          if [ ! -s ipos.json ]; then
            echo "Error: ipos.json is missing or empty. Halting commit to protect cache."
            exit 1
          fi

      - name: Publish Health Audit to Summary
        run: |
          if [ -f data_health_audit.md ]; then
            cat data_health_audit.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipos.json data_health_audit.md gmp_data.json
          if git diff --staged --quiet; then
            echo "No changes detected across dataset and GMP files."
          else
            git commit -m "Auto-sync IPO pipeline and dynamic GMP [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
          
